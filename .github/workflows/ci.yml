# Every pull request to dev or main lints, tests and builds the front, so a broken change is caught before the merge,
# not at the deploy. No secrets and read-only: nothing is published, so a PR from a fork is as safe as one from here.
# Making the check required (branch protection on dev and main) is a GitHub setting: ../LifeManager/docs/deploy.md,
# "CI dos PRs".
name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
