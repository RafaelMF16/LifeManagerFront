<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app icon: a ship's helm, "you at the helm of your life", in the brand's teal. The same drawing as the
       pixel-art loading helm (scripts/generate-helm-sprites.mjs) and as shared/components/AppLogo/; change them
       together. Source of the PNG icons: scripts/generate-icons.mjs. -->
  <defs>
    <!-- One handle with its round grip, pointing right; the other seven are this one rotated by 45°. -->
    <g id="outline-arm">
      <path d="M78 50H91" stroke="#115e59" stroke-width="9" stroke-linecap="round"/>
      <circle cx="91" cy="50" r="7" fill="#115e59"/>
    </g>
    <g id="arm">
      <path d="M78 50H91" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
      <circle cx="91" cy="50" r="5.5" fill="#0d9488"/>
    </g>
    <path id="spoke" d="M58 50H74" stroke="#115e59" stroke-width="4" stroke-linecap="round"/>
  </defs>
  <!-- Outline under the handles and the rim. -->
  <use href="#outline-arm"/>
  <use href="#outline-arm" transform="rotate(45 50 50)"/>
  <use href="#outline-arm" transform="rotate(90 50 50)"/>
  <use href="#outline-arm" transform="rotate(135 50 50)"/>
  <use href="#outline-arm" transform="rotate(180 50 50)"/>
  <use href="#outline-arm" transform="rotate(225 50 50)"/>
  <use href="#outline-arm" transform="rotate(270 50 50)"/>
  <use href="#outline-arm" transform="rotate(315 50 50)"/>
  <circle cx="50" cy="50" r="27.5" fill="none" stroke="#115e59" stroke-width="11"/>
  <use href="#arm"/>
  <use href="#arm" transform="rotate(45 50 50)"/>
  <use href="#arm" transform="rotate(90 50 50)"/>
  <use href="#arm" transform="rotate(135 50 50)"/>
  <use href="#arm" transform="rotate(180 50 50)"/>
  <use href="#arm" transform="rotate(225 50 50)"/>
  <use href="#arm" transform="rotate(270 50 50)"/>
  <use href="#arm" transform="rotate(315 50 50)"/>
  <!-- Spokes inside the rim. -->
  <use href="#spoke"/>
  <use href="#spoke" transform="rotate(45 50 50)"/>
  <use href="#spoke" transform="rotate(90 50 50)"/>
  <use href="#spoke" transform="rotate(135 50 50)"/>
  <use href="#spoke" transform="rotate(180 50 50)"/>
  <use href="#spoke" transform="rotate(225 50 50)"/>
  <use href="#spoke" transform="rotate(270 50 50)"/>
  <use href="#spoke" transform="rotate(315 50 50)"/>
  <!-- The rim, lit from the top left. -->
  <circle cx="50" cy="50" r="27" fill="none" stroke="#14b8a6" stroke-width="9"/>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round"
          pathLength="360" stroke-dasharray="70 290" transform="rotate(190 50 50)"/>
  <!-- The hub. -->
  <circle cx="50" cy="50" r="10" fill="#0d9488"/>
  <circle cx="50" cy="50" r="6.5" fill="#f0fdfa"/>
  <circle cx="50" cy="50" r="3" fill="#0f766e"/>
</svg>
