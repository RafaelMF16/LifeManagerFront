<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app icon: four equal slices of a ring (a "wheel of life"), one per area of life. Finance (left, wallet) and
       Habits (right, check) carry their module's lucide icon; the two light slices wait for the next modules.
       Source of the PNG icons: scripts/generate-icons.ps1. -->
  <defs>
    <!-- The right slice: 49.5° to 130.5° (a 9° gap between slices), radii 12 to 47. The others are this one rotated. -->
    <path id="slice" d="M85.74 19.48A47 47 0 0 1 85.74 80.52L59.12 57.79A12 12 0 0 0 59.12 42.21Z"/>
  </defs>
  <use href="#slice" fill="#0d9488"/>
  <use href="#slice" fill="#99f6e4" transform="rotate(90 50 50)"/>
  <use href="#slice" fill="#0f766e" transform="rotate(180 50 50)"/>
  <use href="#slice" fill="#5eead4" transform="rotate(270 50 50)"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- lucide "check" (24 × 24) at 21 units, centered on the right slice (80, 50). -->
    <path transform="translate(69.5 39.5) scale(.875)" d="M20 6 9 17l-5-5"/>
    <!-- lucide "wallet" at 21 units, centered on the left slice (20, 50). -->
    <g transform="translate(9.5 39.5) scale(.875)">
      <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/>
      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>
    </g>
  </g>
</svg>
